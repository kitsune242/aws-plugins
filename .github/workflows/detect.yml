name: "Detect Plugin Changes"

on:
  workflow_call:
    outputs:
      plugins:
        value: ${{ jobs.detect.outputs.plugins }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.set.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        run: |
          # Determine the correct base commit to diff against:
          #   pull_request events → use the PR base branch SHA (reliable, set by GitHub)
          #   push events         → use github.event.before (the previous HEAD on the branch)
          #   first push ever     → fall back to parent commit
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PUSH_BASE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "$ZERO" ]; then
            BASE="$PUSH_BASE"
          else
            BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          fi

          if [ -z "$BASE" ]; then
            echo "WARNING: Could not determine base commit; treating all plugins as changed"
            CHANGED=$(ls -d plugins/*/ 2>/dev/null | cut -d/ -f1,2 | sort -u)
          else
            CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}" | grep '^plugins/' | cut -d/ -f1,2 | sort -u)
          fi

          PLUGINS=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "plugins=$PLUGINS" >> $GITHUB_OUTPUT
          echo "Detected changed plugins: $PLUGINS"
